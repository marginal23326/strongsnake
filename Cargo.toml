[package]
name = "snake-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [
    "crates/snake-domain",
    "crates/snake-ai",
    "crates/snake-io",
    "crates/snake-api",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[dependencies]
anyhow = "1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
snake-ai = { version = "0.1.0", path = "crates/snake-ai" }
snake-api = { version = "0.1.0", path = "crates/snake-api" }
snake-domain = { version = "0.1.0", path = "crates/snake-domain" }
snake-io = { version = "0.1.0", path = "crates/snake-io" }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

[features]
default = []
gui = ["dep:eframe"]
profiling = ["snake-ai/profiling"]